plugins {
    id 'org.springframework.boot' version '3.2.3'
    id 'java'
}

group = 'com.bluebox'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // BOM imports via platform()
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.2.3')
    implementation platform('io.opentelemetry:opentelemetry-bom:1.36.0')
    implementation platform('io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:2.3.0-alpha')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OpenTelemetry SDK
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-sdk-metrics'

    // OTLP Exporters
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // Spring Boot OTel auto-instrumentation starter
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'

    // Micrometer -> OTel bridge
    implementation 'io.micrometer:micrometer-registry-otlp'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}
