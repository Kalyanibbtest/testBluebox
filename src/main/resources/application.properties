# ─────────────────────────────────────────────
# Application
# ─────────────────────────────────────────────
spring.application.name=testBluebox
server.port=8080

# ─────────────────────────────────────────────
# Actuator (exposes /actuator/health, /actuator/metrics, etc.)
# ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ─────────────────────────────────────────────
# OpenTelemetry (spring-boot-starter auto-config)
# Override these via environment variables in production.
# ─────────────────────────────────────────────

# Service name shown in traces / Dynatrace
otel.service.name=${spring.application.name}

# Where to send traces (OTLP gRPC).
# For Dynatrace: https://<your-env>.live.dynatrace.com/api/v2/otlp
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.exporter.otlp.headers=${OTEL_EXPORTER_OTLP_HEADERS:}

# Propagation: W3C TraceContext + Baggage
otel.propagators=tracecontext,baggage

# Export all three signals
otel.logs.exporter=otlp
otel.metrics.exporter=otlp
otel.traces.exporter=otlp

# Logging
logging.level.com.bluebox=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - traceId=%X{traceId} spanId=%X{spanId} - %msg%n
